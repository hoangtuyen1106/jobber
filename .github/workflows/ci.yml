name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup protoc
        uses: arduino/setup-protoc@v3.0.0

      - run: npm ci --legacy-peer-deps
      - uses: nrwl/nx-set-shas@v5

      # Nx Affected runs only tasks affected by the changes in this PR/commit. Learn more: https://nx.dev/ci/features/affected
      - run: npx nx affected -t lint test build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 639852019248.dkr.ecr.us-east-2.amazonaws.com

      - name: Build and push all images to ECR
        run: |
          IMAGES=(
            "jobs apps/jobs/Dockerfile"
            "executor apps/executor/Dockerfile"
            "auth apps/auth/Dockerfile"
          )

          declare -A PIDS
          for image in "${IMAGES[@]}"; do
            NAME=$(echo $image | cut -d' ' -f1)
            DOCKERFILE=$(echo $image | cut -d' ' -f2)

            {
              echo "Starting build for $NAME..."
              docker build \
                --tag 639852019248.dkr.ecr.us-east-2.amazonaws.com/jobber/$NAME:latest \
                -f $DOCKERFILE \
                . && docker push 639852019248.dkr.ecr.us-east-2.amazonaws.com/jobber/$NAME:latest
              echo "Successfully pushed $NAME"
            } &
            PIDS[$NAME]=$!
          done

          FAILED=0
          for NAME in "${!PIDS[@]}"; do
            if ! wait ${PIDS[$NAME]}; then
              echo "ERROR: Failed to build/push $NAME"
              FAILED=1
            fi
          done

          exit $FAILED
